<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Agent Orange — a runtime for small teams of agents that share one memory">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#241206"/>
      <stop offset="55%" stop-color="#160b04"/>
      <stop offset="100%" stop-color="#0b0603"/>
    </linearGradient>
    <radialGradient id="fruit" cx="38%" cy="32%" r="72%">
      <stop offset="0%" stop-color="#ffb347"/>
      <stop offset="48%" stop-color="#ff8c1a"/>
      <stop offset="100%" stop-color="#d9600a"/>
    </radialGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffd8a8"/>
      <stop offset="60%" stop-color="#ff9c33"/>
      <stop offset="100%" stop-color="#ff7a18"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>

  <!-- the mark: an orange whose segments are workers and whose core is the shared memory -->
  <g transform="translate(172,160)">
    <circle r="96" fill="none" stroke="#ff8c1a" stroke-opacity="0.16" stroke-width="1.5"/>
    <circle r="84" fill="url(#fruit)"/>
    <circle r="84" fill="none" stroke="#ffd7a0" stroke-opacity="0.45" stroke-width="2"/>

    <!-- segment walls -->
    <g stroke="#8a3c04" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round">
      <line x1="0" y1="0" x2="84" y2="0"/>
      <line x1="0" y1="0" x2="59.4" y2="-59.4"/>
      <line x1="0" y1="0" x2="0" y2="-84"/>
      <line x1="0" y1="0" x2="-59.4" y2="-59.4"/>
      <line x1="0" y1="0" x2="-84" y2="0"/>
      <line x1="0" y1="0" x2="-59.4" y2="59.4"/>
      <line x1="0" y1="0" x2="0" y2="84"/>
      <line x1="0" y1="0" x2="59.4" y2="59.4"/>
    </g>

    <!-- workers: they touch the core, never each other -->
    <g fill="#2a1204">
      <circle cx="43.8" cy="-43.8" r="7"/>
      <circle cx="-43.8" cy="-43.8" r="7"/>
      <circle cx="-43.8" cy="43.8" r="7"/>
      <circle cx="43.8" cy="43.8" r="7"/>
      <circle cx="62" cy="0" r="5.5"/>
      <circle cx="-62" cy="0" r="5.5"/>
    </g>

    <!-- the shared core -->
    <circle r="15" fill="#2a1204"/>
    <circle r="15" fill="none" stroke="#ffd7a0" stroke-opacity="0.7" stroke-width="2"/>
    <circle r="6" fill="#ffb347"/>
  </g>

  <g transform="translate(320,0)">
    <text x="0" y="150" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="72" font-weight="700" letter-spacing="2" fill="url(#word)">AGENT ORANGE</text>
    <text x="4" y="196" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="25" fill="#e8c9a6" fill-opacity="0.92">Small teams of agents. One shared memory. Nothing else.</text>
    <text x="4" y="238" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#ff9c33" fill-opacity="0.72">workers · labelled memory · schedules · one subscription</text>
  </g>
</svg>
