# CI for Agent Orange. Runs the gates for all three packages — the Go engine
# (go/), the in-image agent (sandbox/) and the chat UI (web/) — which together
# are the whole repo's definition of green. See CLAUDE.md, "Build & test the
# engine".
#
# Provenance note: this file was inherited from the in-house "agentkit" library
# when it was staged inside another repo, and the job/workflow names still say
# agentkit. They are kept because they are the check names branch protection
# refers to; the module path is github.com/binocarlos/badcode-agent-orange and
# the Platinum-import guard below exists only to keep the old coupling from
# coming back.
name: agentkit-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Repo-wide source hygiene. Cheap, and it guards a class of defect that
  # defeats review itself: a raw NUL byte in a source file makes grep report
  # "no matches" and git report "Binary files differ / 0 insertions, 0
  # deletions". Five web/src files carried one for months (doc 22 RD25) and
  # every search over that directory was silently wrong for as long.
  hygiene:
    name: Hygiene (no raw NUL bytes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-no-nul-bytes.sh

  go:
    name: Go (build · test · vet)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    # pgvector, not plain postgres: migration 022 needs CREATE EXTENSION vector,
    # and on an image without it the memory column is silently skipped — which is
    # the exact "degrades to keyword-only without telling you" state the suite
    # exists to catch.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: No Platinum imports (liftability invariant)
        run: |
          if grep -rn "bayesprice/Platinum\|Bayes-Price/Platinum" .; then
            echo "::error::agentkit Go module must not import from Platinum"; exit 1
          fi
      - run: go build ./...

      # THE LIVE-POSTGRES RUN. Until 2026-08-08 this step had no database, so
      # every one of the ~500 live-PG cases SKIPPED and CI had never once
      # executed them — while the product layer is Postgres-only, so its entire
      # storage layer (jsonb label selectors, the tsvector/pgvector hybrid
      # search, all 42 migrations) was invisible here. Locally it is worth ~10
      # points of agentdb coverage: 75.7% without, 85.4% with.
      #
      # -p 1 is REQUIRED, not tidiness: packages running in parallel against one
      # database produce false failures and leak a connection pool per test.
      #
      # The guard below matters as much as the run. These cases skip when the
      # variable is unset, so a typo in the service config would restore the old
      # silence and leave CI green — the failure mode this step was added to end.
      - name: Live-Postgres cases actually ran (not skipped)
        env:
          AGENTKIT_TEST_POSTGRES_URL: postgres://postgres:test@localhost:5432/postgres?sslmode=disable
        run: |
          go test ./agentdb/ -run TestLivePG -count=1 -v > /tmp/livepg.txt 2>&1 || { cat /tmp/livepg.txt; exit 1; }
          ran=$(grep -c -- '--- PASS' /tmp/livepg.txt || true)
          skipped=$(grep -c -- '--- SKIP' /tmp/livepg.txt || true)
          echo "live-PG: $ran passed, $skipped skipped"
          if [ "$ran" -eq 0 ] || [ "$skipped" -gt 0 ]; then
            echo "::error::live-Postgres cases did not run ($ran passed, $skipped skipped) — the database is not reachable"
            cat /tmp/livepg.txt; exit 1
          fi

      - name: go test (with live Postgres)
        env:
          AGENTKIT_TEST_POSTGRES_URL: postgres://postgres:test@localhost:5432/postgres?sslmode=disable
        run: go test ./... -count=1 -p 1

      - run: go vet ./...

      # Build-tagged packages are invisible to every step above: `go test ./...`
      # skips them, so systemtest/ rotted for months against a removed Suspend/
      # Resume API while CI stayed green. This step type-checks everything the
      # `integration` tag switches on, so it must keep compiling against the
      # live API.
      #
      # THIS IS A COMPILE GATE, NOT A RUN. The suite builds the sandbox image
      # and starts real containers, so a green CI does NOT mean the integration
      # tests passed — only that they still type-check. Run them by hand:
      #   cd go && go test -tags integration ./systemtest/ -v -timeout 900s
      #
      # All THREE tags, not just `integration`. `docker` (execenv, blobarchive,
      # ociregistry) and `gcs` (gcsblob) were invisible to every step in this
      # job — not run, and not even compiled — which is the exact state
      # systemtest/ was in while it rotted.
      - name: Build-tagged packages still compile
        run: go vet -tags "integration docker gcs" ./...

  sandbox:
    name: Sandbox (typecheck · test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sandbox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: yarn install --frozen-lockfile
      - run: yarn typecheck
      - run: yarn test

  web:
    name: Web (typecheck · test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # npm, not yarn: web/ tracks package-lock.json only. Its yarn.lock was
      # deleted deliberately — npm>=7 rewrites a lone yarn.lock destructively,
      # and every documented command for this package is npm. `yarn install
      # --frozen-lockfile` here would fail outright with no lockfile to freeze.
      # sandbox/ still tracks both and keeps using yarn above.
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # examples/web is the app shell the stack actually SERVES — web/ is a
  # component library with no router — and until now nothing in CI built it.
  # A break here is invisible to the web job above and shows up as a blank page
  # in the browser, or as an e2e failure 35 minutes downstream.
  #
  # yarn, not npm: examples/web tracks only yarn.lock, and it is what
  # deploy/web.Dockerfile installs with.
  examples-web:
    name: Examples web (typecheck · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # web/'s dependencies, installed before examples/web's own. Not
      # belt-and-braces: examples/web's tsconfig maps `@agentkit/chat-ui` to
      # `../../web/src/index.ts`, so typechecking this package compiles web's
      # SOURCE — and that needs react and its types on disk under web/.
      # Without this the job fails with "Cannot find module 'react'" pointing at
      # ../../web/src/watermark.ts, which reads like an examples/web bug and is
      # not one. (This dependency is undeclared and bites a fresh clone too; it
      # went unnoticed because anyone building examples/web locally had already
      # installed web/.)
      #
      # npm, not yarn: web/ tracks package-lock.json only.
      - name: Install web/ dependencies
        run: npm ci
        working-directory: web
      - run: yarn install --frozen-lockfile
      - run: yarn typecheck
      - run: yarn build

  # The comparison rig's offline unit layer: 223 tests over the arithmetic
  # behind every topology comparison — ranking, variance, report determinism,
  # and the Tier B grader's blind shuffle (one test builds a deliberately rigged
  # grader that ranks by shuffle position, to prove the scoring notices). No
  # stack, no docker, no network; the tests themselves take ~0.2s.
  #
  # This tests the MEASURING INSTRUMENT, not the product. A regression here
  # breaks nothing a user touches — it makes a research number quietly wrong,
  # which is worse in its own way, because nothing else in this file would
  # catch it.
  #
  # node 22, not 20 like its neighbours: the Tier B half runs from source under
  # --experimental-strip-types, which needs >= 22.6. That is how it is written
  # to be run, deliberately (e2e/experiments/tierb/README.md), and run.sh fails
  # rather than skips on an older runtime.
  experiments:
    name: Experiments rig (offline unit layer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: ./e2e/experiments/run.sh test

  # The stack end-to-end suite: the real docker-compose stack — same binaries,
  # same Postgres, same container runtime a user gets — driven through a browser.
  # Until 2026-08-08 no CI job ran ANY of it, so ~90 browser tests covering the
  # console, topologies, embedding and the §8.7 acceptance loop only ever ran
  # when somebody remembered to run them locally.
  #
  # It is slow (image builds + real session containers), hence its own job so it
  # cannot delay the fast gates above.
  e2e:
    name: Stack e2e (mock model)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npx playwright install --with-deps chromium

      # `id` so the test steps below can require the stack specifically, rather
      # than requiring that nothing at all has failed yet. See their condition.
      - name: Bring up the stack (mock model — no credentials, no spend)
        id: up
        run: ./e2e/run-stack-e2e.sh up mock

      # Six runs, not one. `--mock-script` and `--port-pool` are agentd-wide and
      # read ONCE at boot, so each variant restarts agentd; a spec needing one
      # skips itself without it. Running only the baseline would look green while
      # silently skipping the acceptance loop — the bar the whole spec is
      # measured against (docs/product/06-work-plan.md, Track G).
      - name: Baseline specs
        run: ./e2e/run-stack-e2e.sh test mock

      # THE CONDITION ON EVERY STEP BELOW IS LOAD-BEARING. Read before editing.
      #
      # A step's default condition is `success()`: it runs only if everything
      # before it passed. So on 2026-08-08 one racy assertion in the baseline
      # marked all five steps below as `skipped` and five whole suites never
      # executed — and the topology specs were invisible TWICE, since they also
      # skip themselves in the baseline for want of their script. One broken
      # spec cost the run its entire remaining signal.
      #
      # `success() || failure()` alone would over-correct: if the STACK fails to
      # come up, all five would still run and spend five timeouts discovering
      # there is nothing to talk to. Hence `steps.up.outcome == 'success'` —
      # these steps depend on the stack, not on each other.
      #
      # Net: stack up → every test step reports its own verdict, and the job
      # still fails if any of them do. Stack down → none of them run.
      #
      # NOT `if: always()`, which also runs after a cancel — nobody wants five
      # more test steps grinding through a run they just stopped. Teardown does
      # use always(), because that is exactly when it must run.
      #
      # Scoped to its own spec, like every other scripted step. A script is
      # agentd-wide, so an unscoped run applies THIS script to specs that need a
      # different one and fails them for no reason — which is exactly what an
      # unscoped version of this step did when it was first written.
      - name: The §8.7 acceptance loop (a worker rewrites another's prompt)
        if: (success() || failure()) && steps.up.outcome == 'success'
        run: ./e2e/run-stack-e2e.sh test mock --mock-script e2e/mock-scripts/g1-acceptance.json -- e2e/features/acceptance-loop.spec.ts

      - name: Topologies
        if: (success() || failure()) && steps.up.outcome == 'success'
        run: ./e2e/run-stack-e2e.sh test mock --mock-script e2e/mock-scripts/topologies.json -- e2e/features/topologies.stack.spec.ts

      - name: Embedding / named sessions / session schedules
        if: (success() || failure()) && steps.up.outcome == 'success'
        run: ./e2e/run-stack-e2e.sh test mock --mock-script e2e/mock-scripts/embedding.json -- e2e/features/embedding.stack.spec.ts

      - name: Learning stories
        if: (success() || failure()) && steps.up.outcome == 'success'
        run: ./e2e/run-stack-e2e.sh test mock --mock-script e2e/mock-scripts/learning-stories.json -- e2e/features/learning-stories.stack.spec.ts

      # architect-archivist@v1, the recommended shape — and the only shape that
      # had no e2e at all until 2026-08-08, which mattered because the loop it
      # describes could not run: `POST /agent/session` dropped the `worker` the
      # console had been sending for months, so a chat carried no worker
      # identity, so it never emitted worker.finished, so the archivist could
      # never be woken by a conversation. Two silent defects holding each other
      # up. This step is what stops them coming back.
      #
      # The only step needing TWO overrides, which is why they had to become
      # combinable: the script makes the model call tools, and --idle-timeout
      # turns "a conversation goes quiet" from a 30-minute wait into a 1-minute
      # one (agentd's floor — the archive sweep runs once a minute). It is
      # therefore the slowest step per test in this job, and worth it.
      - name: The architect-archivist loop
        if: (success() || failure()) && steps.up.outcome == 'success'
        run: ./e2e/run-stack-e2e.sh test mock --mock-script e2e/mock-scripts/architect-archivist.json --idle-timeout 1m -- e2e/features/architect-archivist.stack.spec.ts

      # A three-port pool instead of a hundred: the exhaustion path is
      # unreachable at the default size.
      - name: Port-pool exhaustion
        if: (success() || failure()) && steps.up.outcome == 'success'
        run: ./e2e/run-stack-e2e.sh test mock --port-pool 3 -- e2e/features/port-pool.stack.spec.ts

      - name: Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-stack
          path: e2e/playwright-report-stack/
          retention-days: 7
          if-no-files-found: ignore

      # Diagnosing a red e2e run from a log tail is guesswork; agentd's log says
      # which model it chose, which subscriptions matched and why a job did not
      # run. Cheap to keep, and only read when something is already wrong.
      - name: agentd log
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.stack-e2e.yml -p agent-orange-stack-e2e logs agentd --tail=300

      - name: Tear down
        if: always()
        run: ./e2e/run-stack-e2e.sh down --purge || true
