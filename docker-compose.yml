# Standalone agentd stack. One command:
#   cp .env.example .env && docker compose up --build
# Then open http://localhost:8080
services:
  dind:
    image: docker:27-dind
    privileged: true
    command: ["dockerd", "--host=tcp://0.0.0.0:2375", "--host=unix:///var/run/docker.sock", "--tls=false"]
    environment:
      DOCKER_TLS_CERTDIR: ""
    volumes:
      # NAMED, and load-bearing for boot time. The dind image declares
      # `VOLUME /var/lib/docker`, so without this line every container gets a
      # fresh ANONYMOUS volume: `docker compose down` orphans the old one and
      # the next `up` starts with an empty image store. init-sandbox then
      # rebuilds the sandbox image from scratch every single time — ~96s of
      # `yarn install` before the stack is usable — and the orphaned volumes
      # accumulate on disk unnoticed (they are invisible to `docker volume
      # prune` expectations because nobody thinks to look).
      # Naming it makes the image store survive a restart: the second boot
      # reuses the built image and takes seconds.
      - dind-data:/var/lib/docker
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Builds the sandbox image and loads it into the DinD daemon, then exits.
  init-sandbox:
    image: docker:27-cli
    depends_on:
      dind:
        condition: service_healthy
    environment:
      DOCKER_HOST: tcp://dind:2375
    volumes:
      - ./sandbox:/sandbox:ro
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        docker build -t ${BASE_IMAGE:-agentkit-sandbox:dev} /sandbox
        echo "sandbox image built + present in DinD"

  # Session/message store. pgvector image so the future memory system can
  # CREATE EXTENSION vector without an image swap.
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agentorange}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentorange}
      POSTGRES_DB: ${POSTGRES_DB:-agentorange}
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./deploy/pg-init.sql:/docker-entrypoint-initdb.d/pg-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agentorange} -d ${POSTGRES_DB:-agentorange}"]
      interval: 3s
      timeout: 5s
      retries: 20

  agentd:
    build:
      context: ./go
      dockerfile: ../deploy/agentd.Dockerfile
    # Share DinD's network namespace: agentd reaches the daemon at localhost:2375,
    # and nested session containers reach agentd at the bridge gateway 172.17.0.1.
    # (postgres still resolves by service name — DNS comes from dind's netns,
    # which sits on the same compose network.)
    network_mode: "service:dind"
    depends_on:
      dind:
        condition: service_healthy
      init-sandbox:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      ADDR: ":8099"
      DATABASE_URL: postgres://${POSTGRES_USER:-agentorange}:${POSTGRES_PASSWORD:-agentorange}@postgres:5432/${POSTGRES_DB:-agentorange}?sslmode=disable
      DOCKER_HOST: tcp://localhost:2375
      AGENTKIT_IMAGE: ${BASE_IMAGE:-agentkit-sandbox:dev}
      AGENTKIT_SELF_URL: http://172.17.0.1:8099
      # Where a human clicking a session permalink lands (the web UI's
      # externally reachable base URL) — NOT AGENTKIT_SELF_URL, which is a DinD
      # bridge address only containers can reach. Route: /p/<project>/s/<session>.
      AGENTKIT_PUBLIC_BASE_URL: ${AGENTKIT_PUBLIC_BASE_URL:-http://localhost:${WEB_PORT:-8080}}
      # Memory's semantic leg (§7.5): none (default) | mock. Without this line the
      # variable never reached agentd, so setting it in .env silently did nothing
      # and memory search stayed keyword+recency whatever the docs said.
      AGENTKIT_EMBEDDING_BACKEND: ${AGENTKIT_EMBEDDING_BACKEND:-}
      # The `openai` backend needs a key; the model and base URL are optional
      # (text-embedding-3-small / api.openai.com). Same lesson as above: these
      # must be forwarded explicitly or setting them in .env does nothing.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AGENTKIT_EMBEDDING_MODEL: ${AGENTKIT_EMBEDDING_MODEL:-}
      AGENTKIT_EMBEDDING_BASE_URL: ${AGENTKIT_EMBEDDING_BASE_URL:-}
      # Host port pool for session containers. Unset → 30001-30100, i.e. 100
      # concurrent sessions on this host — one live session leases one port and
      # holds it until the session is DELETED. Set both or neither; nonsense is
      # refused at boot. A test stack narrows it (…START=40000, …END=40002) to
      # reach the pool-exhausted error deliberately instead of with 100 sessions.
      AGENTKIT_PORT_RANGE_START: ${AGENTKIT_PORT_RANGE_START:-}
      AGENTKIT_PORT_RANGE_END: ${AGENTKIT_PORT_RANGE_END:-}
      # TEST RIGS ONLY — how many consecutive failed firings retire a schedule
      # (§8.6). Unset → the product default of 5. The e2e overlay lowers it
      # because the streak is counted in cron MINUTES, so the default costs five
      # minutes of wall clock in a single test.
      AGENTKIT_SCHEDULE_MAX_PROVISION_FAILURES: ${AGENTKIT_SCHEDULE_MAX_PROVISION_FAILURES:-}
      # Session garbage collection (gc.go). Unset → a session idle for 30m has
      # its container snapshotted and released — the session ROW survives and
      # the next message restores it, so this frees a container and its host
      # port without losing a conversation. Without it nothing reclaims
      # anything on a timer and the port pool above only ever drains.
      AGENTKIT_SESSION_IDLE_TIMEOUT: ${AGENTKIT_SESSION_IDLE_TIMEOUT:-}
      # How often the snapshot TTL reaper sweeps expired catalogue images
      # (§13.7). Unset → 6h. The expiry itself is per project
      # (project_settings.snapshot_ttl_days). "off" disables either loop.
      AGENTKIT_SNAPSHOT_REAP_INTERVAL: ${AGENTKIT_SNAPSHOT_REAP_INTERVAL:-}
      AGENTKIT_JWT_SECRET: ${AGENTKIT_JWT_SECRET:-}
      # OPTIONAL. The signing key for per-session container tokens. Unset (the
      # normal case) agentd derives it from AGENTKIT_JWT_SECRET, so a session
      # container's token is not a project credential and nothing needs
      # configuring. Set it only to roll the session key independently — and
      # never to the same value as AGENTKIT_JWT_SECRET (agentd warns at boot).
      # Forwarded here so setting it in .env is not a silent no-op.
      AGENTKIT_SESSION_JWT_SECRET: ${AGENTKIT_SESSION_JWT_SECRET:-}
      # Login modes (see .env.example). Neither set → legacy dev-open demo.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      AGENTKIT_TEST_LOGIN: ${AGENTKIT_TEST_LOGIN:-}
      AGENTKIT_PROJECT_MAP: ${AGENTKIT_PROJECT_MAP:-}
      AGENTKIT_PROJECT_MAP_FILE: ${AGENTKIT_PROJECT_MAP_FILE:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Claude Code subscription token (`claude setup-token`). Only used when
      # ANTHROPIC_API_KEY is unset → sessions bill the subscription directly.
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      # Offline mock-model script (see .env.example). Only read when
      # ANTHROPIC_API_KEY is unset. Unset → today's canned single-text-turn mock;
      # set → the mock can emit tool_use, which is how an offline test makes a
      # worker call an MCP tool. FILE is a path INSIDE this container.
      AGENTKIT_MOCK_MODEL_SCRIPT: ${AGENTKIT_MOCK_MODEL_SCRIPT:-}
      AGENTKIT_MOCK_MODEL_SCRIPT_FILE: ${AGENTKIT_MOCK_MODEL_SCRIPT_FILE:-}
      AGENTKIT_DATA: /data
      # MCP credential allowlist (see .env.example). Comma-separated NAMES of
      # environment variables agentd forwards into every session container, so
      # the sandbox can resolve the ${VAR} references in MCP config. Unset =
      # forward nothing. agentd refuses to forward its own secrets (JWT secret,
      # model keys, DATABASE_URL) even if listed.
      AGENTKIT_MCP_ENV: ${AGENTKIT_MCP_ENV:-}
      # …and the variables themselves must reach agentd. Compose cannot pass a
      # dynamic set of names, so add one line per credential you allowlisted:
      #   GMAIL_API_KEY: ${GMAIL_API_KEY:-}
      #   NOTION_AUTH: ${NOTION_AUTH:-}
      # Storage backends — unset = local (fs blobs + blob-archive). See .env.example.
      AGENTKIT_BLOB_BACKEND: ${AGENTKIT_BLOB_BACKEND:-}
      GCS_BUCKET: ${GCS_BUCKET:-}
      GCS_PREFIX: ${GCS_PREFIX:-}
      AGENTKIT_REGISTRY_BACKEND: ${AGENTKIT_REGISTRY_BACKEND:-}
      AGENTKIT_REGISTRY_AUTH: ${AGENTKIT_REGISTRY_AUTH:-}
      GCP_REGION: ${GCP_REGION:-}
      GCP_PROJECT: ${GCP_PROJECT:-}
      GCP_AR_REPO: ${GCP_AR_REPO:-}
      OCI_REGISTRY: ${OCI_REGISTRY:-}
      OCI_USERNAME: ${OCI_USERNAME:-}
      OCI_PASSWORD: ${OCI_PASSWORD:-}
      # GCP auth (ADC). To use GCS/Artifact Registry, mount a service-account key
      # (volume below) and point this at it.
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
    volumes:
      - agentd-data:/data
      # Offline mock-model script as a file, for scripts too long to sit on one
      # .env line. Uncomment BOTH this and AGENTKIT_MOCK_MODEL_SCRIPT_FILE:
      #  - ./mock-model-script.json:/mock-model-script.json:ro
      #    …with AGENTKIT_MOCK_MODEL_SCRIPT_FILE=/mock-model-script.json
      # GCP credentials (ADC) for gcs/ociregistry — pick ONE (see docs/15):
      #  • local dev: mount your gcloud ADC (after `gcloud auth application-default login`)
      #    - ${HOME}/.config/gcloud:/root/.config/gcloud:ro
      #  • CI / no metadata server: mount a service-account key + set GOOGLE_APPLICATION_CREDENTIALS
      #    - ${GOOGLE_APPLICATION_CREDENTIALS:-/dev/null}:/gcp/key.json:ro

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    depends_on:
      - agentd
    ports:
      - "${WEB_PORT:-8080}:8080"

volumes:
  agentd-data:
  pg-data:
  # DinD's image store. See the comment on the dind service: named so the built
  # sandbox image survives `down`/`up` instead of being rebuilt every boot.
  dind-data:
