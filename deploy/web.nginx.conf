# Fail closed if agentd answers the framing subrequest below without a header.
# It cannot today (embedcsp.go always sets one), but an empty value would make
# nginx skip add_header entirely — and a page with no CSP is framable by anyone,
# which is the opposite of the default this feature promises.
map $embed_csp $embed_csp_header {
    ""      "frame-ancestors 'none'";
    default $embed_csp;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The embed page is a second entry point, not an SPA route: /embed/session/<name>
    # must serve embed.html (one session's chat, no login gate, no project picker)
    # rather than the console shell. Longer prefix, so it wins over `location /`.
    location /embed/ {
        # Who may frame this page (T13). agentd owns the answer — the origin list
        # lives in the project map, which only agentd reads — so it is fetched per
        # request and copied onto this static response. The alternative, an nginx
        # `map` keyed by project, cannot work: /embed/session/<name> carries no
        # project and the token is in the fragment, which never reaches a server
        # (go/cmd/agentd/embedcsp.go explains what that forces).
        auth_request /internal/embed-csp;
        auth_request_set $embed_csp $upstream_http_content_security_policy;
        add_header Content-Security-Policy $embed_csp_header always;

        # `=404`, not a `/embed.html` fallback: a URI fallback is an INTERNAL
        # REDIRECT, which re-matches `location /` and serves the page from there
        # — losing this block's add_header, i.e. shipping the embed page with no
        # framing header at all. Both entries below are files served in place.
        try_files $uri /embed.html =404;
    }

    # agentd's frame-ancestors answer for the block above. `internal`, so it is
    # reachable only from that subrequest and never from a browser. If agentd is
    # down this subrequest fails and the embed page 500s — acceptable, since the
    # page cannot resolve its session without agentd either.
    location = /internal/embed-csp {
        internal;
        proxy_pass http://dind:8099/embed/csp;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }

    # SPA fallback for the bundled UI.
    location / {
        try_files $uri /index.html;
    }

    # API + token → agentd (which shares DinD's netns; reachable as dind:8099).
    location /agent/ {
        proxy_pass http://dind:8099;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        # SSE: never buffer the event stream.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
    location /dev/ {
        proxy_pass http://dind:8099;
        proxy_set_header Host $host;
    }
    location /auth/ {
        proxy_pass http://dind:8099;
        proxy_set_header Host $host;
    }
}
