# Postgres with pgvector.
#
# The product layer is Postgres-only and NOT optional: on the sqlite fallback
# the router never routes, schedules never fire and the core MCP server is not
# mounted — and nothing fails at use time, it just quietly does nothing.
#
# pgvector matters for the same reason: memory search fuses a keyword leg and a
# vector leg. Without the extension the vector leg is absent.
#
# For a prototype this in-cluster instance is the cheap option. Cloud SQL is the
# one to move to when losing the volume would actually hurt — this StatefulSet
# has no backups.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: agent-orange
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: agent-orange
data:
  # Mirrors deploy/pg-init.sql. agentdb's own migrations create every table;
  # this only pre-enables the extension they depend on.
  pg-init.sql: |
    CREATE EXTENSION IF NOT EXISTS vector;
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: agent-orange
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          env:
            - name: POSTGRES_USER
              value: agentorange
            - name: POSTGRES_DB
              value: agentorange
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: agent-orange, key: postgres-password}}
            # The image initialises into a SUBDIRECTORY of the mount, because a
            # PVC root carries a lost+found that initdb refuses to start in.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: pg-data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          resources:
            requests: {cpu: 100m, memory: 512Mi}
            limits: {memory: 2Gi}
          readinessProbe:
            exec:
              command: [sh, -c, "pg_isready -U agentorange -d agentorange"]
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: init
          configMap: {name: postgres-init}
  volumeClaimTemplates:
    - metadata:
        name: pg-data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 10Gi
